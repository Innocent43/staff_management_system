services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: staff_attendance_db
    ports:
      - "5433:5432"
    volumes:
      - stafftrack_postgres18_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U postgres -d staff_attendance_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6380:6379"
    volumes:
      - stafftrack_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  
  api:
    build: ./backend
    volumes:
      - ./backend:/app
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  

  frontend:
    build:
      context: ./frontend/staff-attendance-app
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    restart: unless-stopped
    env_file:
      - ./frontend/staff-attendance-app/.env.local
    ports:
      - "3000:3000"
    depends_on:
      - api


volumes:
  stafftrack_postgres18_data:
  stafftrack_redis_data: